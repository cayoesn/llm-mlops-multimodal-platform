[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mlops-multimodal-platform"
version = "1.0.0"
description = "OmniPulse AI — Enterprise Open-Source MLOps, Text LLMOps & Multimodal LLMOps (Audio, Video, Image, Text) Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Cayo Eduardo", email = "cayoesn@gmail.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=16.0.0",
    "pillow>=10.3.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
]

[project.optional-dependencies]
cluster = [
    "mlflow>=2.14.0",
    "dvc>=3.50.0",
    "feast>=0.38.0",
    "qdrant-client>=1.9.0",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.uv]
managed = true

